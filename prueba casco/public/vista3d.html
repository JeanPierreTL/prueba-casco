<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casco de ciclista en 3D</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="js/casco.js"></script>
</head>
<body style="margin:0">
  <div style="position:fixed;top:10px;left:10px;z-index:10;background:#fffd;padding:10px;border-radius:8px;font-family:Arial">
    <label><input id="auto" type="checkbox" checked> Simulación automática</label><br>
    Inclinación: <span id="v">0</span>°
    <input id="s" type="range" min="-45" max="45" value="0" style="width:100%">
  </div>

  <a-scene background="color: #071827" vr-mode-ui="enabled: false">
    <a-entity id="casco" casco-ciclista="auto: true" position="0 1.2 -3"></a-entity>
    <a-entity camera position="0 1.6 0" look-controls></a-entity>
  </a-scene>

  <script>
    const c = document.querySelector("#casco");
    const auto = document.querySelector("#auto");
    const s = document.querySelector("#s");
    auto.onchange = () => c.setAttribute("casco-ciclista", {auto: auto.checked, angulo: Number(s.value)});
    s.oninput = () => {
      document.querySelector("#v").textContent = s.value;
      auto.checked = false;
      c.setAttribute("casco-ciclista", {auto: false, angulo: Number(s.value)});
    };
  </script>
</body>
</html>
