<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi primera escena del casco</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>
  <a-scene background="color: #071827" vr-mode-ui="enabled: false">
    <a-entity position="0 1.3 -3">
      <a-sphere radius="0.5" theta-length="90" color="#1e88e5"
        material="shader: flat; side: double"></a-sphere>
      <a-torus radius="0.5" radius-tubular="0.03" rotation="90 0 0"
        color="#fff" material="shader: flat"></a-torus>
      <!-- luz izquierda parpadeante -->
      <a-sphere position="-0.5 0.08 0" radius="0.09" color="#ffa000"
        material="shader: flat"
        animation="property: scale; from: 1 1 1; to: 1.6 1.6 1.6; dur: 400; dir: alternate; loop: true"></a-sphere>
      <a-sphere position="0.5 0.08 0" radius="0.09" color="#3a2a10"
        material="shader: flat"></a-sphere>
    </a-entity>
    <a-entity camera position="0 1.6 0" look-controls></a-entity>
  </a-scene>
</body>
</html>
