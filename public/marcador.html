<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marcador Hiro para MotionHelmet</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 8vmin;
      background: #fff;
      color: #111;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { width: 100%; }
    img {
      display: block;
      width: min(68vmin, 620px);
      height: auto;
      margin: 0 auto;
    }
    p { margin: 20px auto 0; max-width: 620px; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <img src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png"
      alt="Marcador Hiro oficial">
    <p>Muestra esta página completa con brillo medio. No amplíes la imagen y no uses modo oscuro.</p>
  </main>
</body>
</html>
